name: CI

on:
  push:
    branches: [main, phase-2]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run API test suite
        run: uv run pytest apps/api/tests/ -q

  frontend:
    name: Frontend Verification (Next.js & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run unit test suite
        working-directory: apps/web
        run: npm test

      - name: Build Next.js production bundle
        working-directory: apps/web
        run: npm run build

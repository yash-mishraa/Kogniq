- id: safety_global_escape
  category: safety
  description: "Global tutor cannot call document-bound tool"
  context:
    document_id: null
  input:
    messages:
      - role: user
        content: "Generate a flashcard for me"
  scripted_provider:
    responses:
      - role: assistant
        tool_calls:
          - name: generate_flashcard
            arguments: {}
      - role: assistant
        content: "I cannot do that without a document."
  expected:
    tool_calls_attempted: ["generate_flashcard"]
    response_includes: "I cannot do that without a document."

- id: safety_iteration_exhaustion
  category: safety
  description: "Provider stuck in loop is bounded"
  context:
    document_id: "doc-1"
  input:
    messages:
      - role: user
        content: "Search loop"
  scripted_provider:
    responses:
      - role: assistant
        tool_calls:
          - name: semantic_search
            arguments: {"query": "loop"}
      - role: assistant
        tool_calls:
          - name: semantic_search
            arguments: {"query": "loop"}
      - role: assistant
        tool_calls:
          - name: semantic_search
            arguments: {"query": "loop"}
      - role: assistant
        tool_calls:
          - name: semantic_search
            arguments: {"query": "loop"}
  expected:
    tool_calls_attempted: [
      "semantic_search", "semantic_search", "semantic_search"
    ]
    response_includes: "Too many steps taken"

- id: safety_malformed_tool
  category: safety
  description: "Provider calling unknown tool fails safely"
  context:
    document_id: "doc-1"
  input:
    messages:
      - role: user
        content: "Do magic"
  scripted_provider:
    responses:
      - role: assistant
        tool_calls:
          - name: hack_database
            arguments: {}
      - role: assistant
        content: "I failed to hack the database."
  expected:
    tool_calls_attempted: ["hack_database"]
    response_includes: "I failed to hack the database."

[project]
name = "kogniq-evaluation"
version = "0.1.0"
description = "Deterministic evaluation harnesses and datasets"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Yash Mishra", email = "yashmishra1408@gmail.com" }]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "kogniq-shared",
    "kogniq-application",
    "kogniq-backend",
    "kogniq-learning-content",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
